# ============================================================
# Ender 3 Pro - Klipper Config
# Hardware: SKR Mini E3 v3.0 | BTT Pi 1.2.1
#           Sprite SE Extruder | Dual Z | Custom Satsana (5015)
#           Phaetus Dragonfly BMS | BTT Eddy Duo | PEI Steel 250x250
# Firmware: Klipper v0.13+ (host running eddy-ng)
# ============================================================
# NOTE: STM32G0B0 with "8KiB bootloader" and UART communication.
# Flash: klipper.bin -> firmware.bin on the SD card.
# ============================================================
#
#  GEOMETRY — THE SOURCE OF TRUTH FOR THIS FILE
#  --------------------------------------------
#  Every positional coordinate in this file derives from the six
#  lines below. If any of them changes (moving the endstop, moving
#  the Eddy, swapping the plate), EVERY section marked [GEO] must
#  be recalculated.
#
#    PEI plate ............... 250 x 250, centre at (125, 125)
#    Coordinate origin ....... front-left corner of the plate
#    NOZZLE travel ........... X 30..250 , Y 0..250
#    COIL offset ............. (-55, -8)  [55mm left, 8mm front]
#    COIL position ........... nozzle - (55, 8)
#    COIL travel ............. X -25..195 , Y -8..242
#
#  DERIVED CONSTRAINTS
#  -------------------
#   R1  The coil cannot read near the plate edge: part of it sits
#       over air, the signal weakens, and the mesh records a false
#       dip. Minimum 25mm margin on every side.
#         -> coil X 25..225 , Y 25..225
#
#   R2  Intersecting R1 with the coil's travel:
#         -> MESH: X 25..193 , Y 25..223
#       Consequence: the X 193..250 strip is never measured. It
#       prints on extrapolated values. That is the first place to
#       suspect if a part comes out different.
#
#   R3  After every TAP, eddy-ng moves the nozzle +55 / +8 to put
#       the coil over the point it just touched.
#         -> X_tap <= 195  and  Y_tap <= 242
#       Ignoring this gives "Move out of range". The START_PRINT
#       tap happens at (180,133) and moves to (235,141): fine.
#
#   R4  ALWAYS G28 before every tap. Without it, consecutive taps
#       walk across the bed (R3) and end up measuring different
#       points — repeatability dies silently.
#
#   R5  Screws are only reachable by the coil if they sit at
#       X <= 195. Beyond that, SCREWS_TILT measures points that
#       are NOT the screws. See the section for why this turned
#       out not to matter in practice.
#
#   R6  Orca has the bed as 250x250, origin 0,0. Do NOT place
#       parts in the leftmost 35mm: the machine rejects X < 30,
#       and the outer wall is drawn half an extrusion width
#       outside the contour (this already produced
#       "Move out of range: 29.468").
#
#  EDDY-NG — MAINTENANCE NOTES
#  ---------------------------
#   * The Eddy firmware MUST be built from the same source tree
#     where eddy-ng was installed (~/klipper). install.sh copies
#     sensor_ldc1612_ng.c into src/ and patches the Makefile.
#     Building from a different tree fails at runtime with:
#       "mcu 'eddy': Unknown command: ldc1612_ng_start_stop"
#     Flash: make flash FLASH_DEVICE=2e8a:0003, holding the BOOT
#     button while plugging in USB.
#   * The BOOT button is hard to spot, and the unit does NOT
#     enter the bootloader by itself with empty flash — a blinking
#     LED plus total USB silence looks like a dead device and
#     isn't.
#   * Decommissioning a probe also requires deleting its entry
#     from the SAVE_CONFIG block, otherwise Klipper refuses to
#     start.
#   * The coil drifts thermally over a hot plate. At 60C the tap
#     gives stddev 0.005; at 110C without a soak it gives 0.021
#     and fails. Hence the G4 in START_PRINT.
#   * The Eddy Duo contains NO accelerometer. "Duo" refers to it
#     supporting USB or CAN, not to a second sensor.
# ============================================================

# ============================================================
# INCLUDES
# ============================================================
[include mainsail.cfg]
[include klipper-backup.cfg]

# ============================================================
# VIRTUAL SDCARD
# ============================================================
[virtual_sdcard]
path: /home/biqu/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

# ============================================================
# CORE FEATURES
# ============================================================
[exclude_object]
[display_status]
[pause_resume]
[respond]

[gcode_arcs]
resolution: 0.1

[idle_timeout]
timeout: 3600

# Required for SET_KINEMATIC_POSITION, which is the only way to
# move Z when the probe has no calibration and the axis therefore
# cannot be homed. When using it: declare a SMALL value (Z=3 or
# Z=10, so position_min: -3 caps how far a descent can go), move
# in RELATIVE mode (G91 / G1 Z-1) so each command means exactly
# what it says, and re-declare every few steps. Declaring a large
# value and descending by absolute coordinates once drove the
# nozzle into the plate.
[force_move]
enable_force_move: True

# ============================================================
# STEPPERS
# ============================================================
# [GEO] position_endstop = 30: the X endstop was moved inward
# along the rail to clear the new duct. After G28 the nozzle sits
# 30mm from the plate's left edge. position_min must be 30 too —
# without it Klipper accepts a move to X=0, which is 30mm past
# the switch, and the carriage runs into the end stop.
# Do NOT remove homing_speed: Klipper's default is 5mm/s and
# homing crawls.
# ============================================================
[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: 30
position_min: 30
position_max: 250
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.580
stealthchop_threshold: 999999

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_max: 250
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.580
stealthchop_threshold: 999999

# position_min: -3.0 is the Z safety net. It stays negative on
# purpose: tap needs to press below zero to detect contact.
[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 250
position_min: -3.0

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.580
stealthchop_threshold: 999999

# ============================================================
# EXTRUDER - Sprite SE + Dragonfly BMS
# rotation_distance verified: 100mm commanded = 100mm extruded.
# Do not change without repeating the test.
#
# NOTE ON FLOW: this is the Dragonfly BMS, NOT the "Dragonfly HIC
# High Flow". Phaetus publishes no maximum flow figure for it.
# Measured with OrcaSlicer's Max flowrate test (ASA, 240C, no part
# cooling): degraded at 18 mm3/s -> 14.4 used after a 20% margin.
# PLA has NOT been measured; Orca's generic PLA profile assumes 12
# and silently THROTTLES print speed to respect it — which is why
# asking for 300 mm/s outer walls during input shaper testing
# changed nothing. Check the preview in "Speed" mode, not just the
# requested value.
#
# FILAMENT PROFILES LIVE IN ORCASLICER, NOT HERE.
# Temperature, max volumetric speed, pressure advance, flow ratio
# and retraction all change with the material, so they belong in
# the Orca filament profile. Orca emits SET_PRESSURE_ADVANCE and
# the retraction moves at print time. Recorded here for reference:
#
#   ASA (calibrated 2026-09-21, Orca's own test order)
#     temperature ........... 240 C
#     max volumetric speed .. 14.4 mm3/s
#     pressure advance ...... 0.050   (tower, 25mm, step 0.002)
#     flow ratio ............ 0.884   (YOLO, -0.03 from 0.911 + 0.03 from perfectionist)
#     retraction ............ 0.4 mm  (slicer-side, see below)
#
#   PLA — not yet calibrated (flow 0.98 looked over-extruded)
#
# max_extrude_cross_section: 5 is ~8x Klipper's default
# (4 * nozzle_diameter^2 = 0.64). It was raised for KAMP's purge,
# which is gone. The current fixed purge only needs ~0.22, so
# this safety net is disabled for no reason. Lowering it to 1.0
# would restore protection against malformed slicer moves —
# left alone for now to avoid breaking a working purge.
# ============================================================
[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 16
rotation_distance: 7.57
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
min_temp: 0
max_temp: 300
min_extrude_temp: 170
max_extrude_only_distance: 200
max_extrude_cross_section: 5
# Pressure advance is deliberately NOT set here. It is per-filament
# and lives in the Orca filament profile (Advanced -> Enable
# pressure advance), which emits SET_PRESSURE_ADVANCE at print
# start. A value here would silently apply to every material that
# does not set its own. Left commented on purpose — do not
# "uncomment after calibration".
# pressure_advance: 0.050
# pressure_advance_smooth_time: 0.040

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.75
stealthchop_threshold: 0

# ============================================================
# HEATED BED
# ============================================================
[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 130

# ============================================================
# FANS
# ============================================================
[heater_fan heatbreak_cooling_fan]
pin: PC7

[heater_fan controller_fan]
pin: PB15

# ============================================================
# PART COOLING FAN — installed and characterised 2026-09-20
#
# Hardware: Sunon MF50151VX-1B00U-A99, 5015 blower, MagLev.
# It is a 12V fan (confirmed on the RS and DigiKey listings) and
# this board's fan ports run at the INPUT SUPPLY VOLTAGE with no
# voltage-select jumper — 24V here. BTT's wiki: "the operating
# voltage is the same with the input power supply voltage to
# avoid damage." Hence the step-down.
#
# WIRING — the buck's input comes STRAIGHT FROM THE PSU, sharing
# the wire that feeds the board. It is never interrupted:
#
#     PSU 24V ---> [IN+]  BUCK  [OUT+] ---> fan RED
#     GND     ---> [IN-]
#                          fan BLACK ---> FAN0 "-" pin (PC6)
#
# The board switches the LOW side, so the MOSFET chops only the
# fan's negative. (No datasheet needed to know this: if it
# switched the positive, feeding the fan from the buck's output
# would give no speed control at all. Speed control works.)
#
# THE WRONG WAY, for reference: feeding the buck's input from the
# PWM-switched fan pin. A buck needs milliseconds to soft-start
# and the default PWM period is 10ms, so it never finishes
# regulating and its output collapses below some duty threshold.
#
# cycle_time: 0.002 (500Hz) — NOT cosmetic, and the whole reason
# this fan is usable. A 5015 is a BRUSHLESS motor with
# commutation electronics inside. At Klipper's default 100Hz, a
# 30% duty leaves that internal controller unpowered for 7ms of
# every 10ms period: it resets 100 times a second instead of
# spinning. Measured on this machine:
#       100 Hz  ->  would not turn below 55%
#       500 Hz  ->  sustains 10%
# The motor always had the torque; its controller could not stay
# awake. Do NOT push the frequency much higher — there is a case
# on the Klipper Discourse where ~20kHz compressed the usable
# range so far that 5% commanded produced 100% airflow.
#
# kick_start_time: runs at full power briefly when the fan is
# enabled, or when the speed jumps by more than 50% (verified in
# klippy/extras/fan.py). The 0.1s default is too short for a 5015
# to break away from rest.
#
# off_below: forces the value to ZERO below the threshold. It
# does NOT rescale — asking for 15% gives silence, not 20%. Set
# slicer fan speeds to 0 or >= 20 accordingly. There is no native
# PWM remapping in Klipper; min_power was proposed in PRs #2165,
# #4720 and #3208 and never merged.
#
# Test after any rewiring:  M106 S255  then step down.
# Do NOT diagnose this with a multimeter in DC mode — it cannot
# read PWM. An attempt gave 10V at 0%, 2V at 55% and 12V at 100%:
# non-monotonic, therefore an instrument artefact. The only
# reliable observable is whether the impeller turns.
# ============================================================
[fan]
pin: PC6
cycle_time: 0.002        # 500Hz — 100Hz browns out the fan's controller
kick_start_time: 0.5     # 0.1s default is too short for a 5015
off_below: 0.20          # below this, off. Does NOT rescale.

# ============================================================
# MCU & PRINTER
# ============================================================
[mcu]
serial: /dev/ttyS0          # BTT Pi 1.2 with CB1 OS uses ttyS0
baud: 250000
restart_method: command

# square_corner_velocity: 5.0 is Klipper's default and where this
# machine belongs. It was temporarily raised to 10.0 during input
# shaper testing (it is the strongest lever for exciting ringing,
# since it sets how fast the toolhead crosses a corner). Leaving
# it at 10 in normal printing gives visibly dirty corners.
[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
square_corner_velocity: 5.0

[board_pins]
aliases:
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>

# ============================================================
# INPUT SHAPER — deliberately DISABLED. Do not "fix" this.
#
# There is no accelerometer on this machine. Two ringing towers
# were printed through OrcaSlicer's Input Shaping calibration,
# which sweeps SHAPER_FREQ_X/Y up the tower (15-110Hz) so the
# height where ringing vanishes gives the resonant frequency:
#
#     Tower 1:  accel 2000, square_corner_velocity 5   -> uniform
#     Tower 2:  accel 3000, square_corner_velocity 10  -> uniform
#
# Doubling the corner impulse between them changed nothing. If a
# resonance existed in that range, the mismatched zones would
# have rung visibly worse and the matched band would have stood
# out by contrast. It never did.
#
# Both towers looked slightly smoother at the BOTTOM. That is not
# a resonance minimum — it is the low-frequency end of the sweep,
# where the shaper applies large delays and blurs everything,
# corners included. It does prove the SET_INPUT_SHAPER commands
# were taking effect, which is what makes the uniformity
# elsewhere a real result rather than a broken test.
#
# CONCLUSION: this machine has no ringing worth compensating at
# 3000 mm/s2. That is the payoff from the toolhead rebuild —
# rigid, compact, coaxial under the extruder. A stock Ender 3 Pro
# ghosts visibly at this acceleration; this one does not.
#
# DO NOT set "conservative" frequencies here as a guess. A shaper
# tuned BELOW the true resonance smooths heavily — rounded
# corners, lost detail — while cancelling nothing, because there
# is nothing at that frequency to cancel. An unmatched shaper is
# a filter with no target: it costs sharpness and buys nothing.
# Without a measured resonance, no shaper is the correct answer.
#
# IF GHOSTING EVER APPEARS on a real part: do not print more
# towers. Fit an ADXL345 (BTT sells one for ~20 EUR) and measure
# properly with a graph in ten minutes. The Eddy Duo has no
# accelerometer. Only then fill in the template below.
# ============================================================
[input_shaper]
# Template — fill in ONLY from a measured resonance:
# shaper_type_x: mzv
# shaper_freq_x: 0
# shaper_type_y: mzv
# shaper_freq_y: 0

# ============================================================
# FILAMENT RUNOUT SENSOR
# Hardware: NO sensor wired to PC15. Uncomment once installed.
# ============================================================
# [filament_switch_sensor filament_sensor]
# switch_pin: ^PC15
# pause_on_runout: True
# runout_gcode:
#     M117 Filament ran out!
#     M600
# insert_gcode:
#     M117 Filament detected

# ============================================================
# CR TOUCH — REMOVED, replaced by the Eddy Duo.
# Kept commented purely as historical reference.
# If you ever re-enable it: the SAVE_CONFIG block at the end of
# the file also needs its matching [bltouch] entry, otherwise
# Klipper refuses to start with
#   "Option 'control_pin' in section 'bltouch' must be specified"
# ============================================================
#[bltouch]
#sensor_pin: ^PC14
#control_pin: PA1
#x_offset: -46
#y_offset: -3
#speed: 5.0
#samples: 2
#samples_result: median
#sample_retract_dist: 3.5
#samples_tolerance: 0.025
#samples_tolerance_retries: 3

# ============================================================
# [GEO] BTT EDDY DUO (eddy-ng)
#
# Measured offset: 55mm left, 8mm in front of the nozzle.
# If this offset changes, recalculate: safe_z_home, bed_mesh,
# screws_tilt_adjust, TAP_SWEEP and SCREW_CHECK.
#
# tap_adjust_z: how far above the tap-detected contact point the
# nozzle sits. Compensates the assembly's residual flex.
# It is deliberately NOT here — it lives in the SAVE_CONFIG
# block, the same way z_offset does for other probes.
# ALWAYS dial it from a print, never from the paper test:
#   Z_UP / Z_DOWN during the first layer
#   Z_SAVE_OFFSET at the end, then SAVE_CONFIG
#
# History: 0.28 with the old (flexible) toolhead, 0.08 after the
# rebuild. A value climbing back toward 0.28 means something
# started flexing again. Tap stddev also went 0.011-0.015 -> 0.005.
# ============================================================
[mcu eddy]
serial: /dev/serial/by-id/usb-Klipper_rp2040_5044340410BB8B1C-if00
restart_method: command

[probe_eddy_ng btt_eddy]
sensor_type: btt_eddy
i2c_mcu: eddy
i2c_bus: i2c0f
x_offset: -55
y_offset: -8
home_trigger_height: 2.0
write_tap_plot: true

[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10
max_temp: 100

# Coil thermistor. Use this curve in Mainsail's temperature graph
# to pick the soak time in START_PRINT: wait until it flattens
# before the tap happens.
[temperature_sensor btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26

# ============================================================
# [GEO] SAFE Z HOME
#
# Goal: put the COIL over the plate's physical centre (125,125),
# because the coil is what measures during Z homing. If the coil
# is not over metal, the toolhead will not stop.
#
#   nozzle_X = 125 + 55 = 180
#   nozzle_Y = 125 +  8 = 133
#
# NOTE: 115 was used here for a long time, carried over from the
# original 230mm bed. That silently biased homing 10mm right and
# caused the "G28 goes too far right" symptom. The plate is
# 250mm; its centre is 125.
#
# Empirical check (30 seconds, no need to trust the arithmetic):
#   G28 X Y, then jog until the COIL is visually at the plate
#   centre and read X/Y in Mainsail. Should be ~180, 133.
#
# z_hop: 3, not 10. Above ~5mm the coil leaves the sensor's
# usable range and homing starts blind. 3mm is enough to avoid
# dragging the nozzle over an already printed part.
# ============================================================
[safe_z_home]
home_xy_position: 180, 133
speed: 50
z_hop: 3

# ============================================================
# [GEO] BED MESH
#
# mesh_min / mesh_max are COIL coordinates, which map directly to
# physical positions on the plate. They derive from R2:
#
#   X:  max(25, -25) .. min(225, 195)  ->  25 .. 193
#   Y:  max(25,  -8) .. min(225, 242)  ->  25 .. 223
#
# Nozzle during the mesh: X 80..248 , Y 33..231. Within travel.
#
# This already bit us: with mesh_min at 5 the coil partly
# measured off the plate and produced a false -0.496mm dip, with
# the range jumping from 0.199 to 0.525. Do not go below 25.
#
# Current state: range 0.145mm after tramming (was 0.281mm).
# Extremes both in the Y=58 row: -0.103 at X=25, +0.043 at X=193.
# What remains is the steel sheet's own flatness — no amount of
# screw-turning reduces it, and compensating it is precisely what
# this mesh is for.
#
# horizontal_move_z: 2.0 — the eddy's optimal reading height.
# Unlike a contact probe, there is no benefit whatsoever in
# lifting between points.
# ============================================================
[bed_mesh]
speed: 150
probe_count: 7, 7
fade_start: 1.0
fade_end: 10.0
fade_target: 0.0
mesh_pps: 2, 2
horizontal_move_z: 2.0
mesh_min: 25, 25
mesh_max: 193, 223
algorithm: bicubic

# ============================================================
# [GEO] SCREWS TILT ADJUST
#
# These values are NOZZLE positions, computed so the COIL lands
# over each screw:   nozzle = screw + (55, 8)
# Assumed screw positions: (32,36) (202,36) (202,206) (32,206).
#
# COORDINATES VALIDATED BY OUTCOME (2026-09-13). They were
# derived from the old CR Touch config and never measured, which
# was a standing worry. Acting on their readings took the mesh
# range from 0.281mm to 0.145mm — that does not happen if the
# probe is landing on arbitrary spots. Good enough; SCREW_CHECK
# is no longer needed routinely.
#
# Tramming result at 60C:
#     front left  (base)   0.17833
#     front right          0.19522    CCW 00:01
#     rear right           0.16229    CW  00:01
#     rear left            0.16984    CW  00:01
#   Spread 0.033mm, all four at 00:01 — the smallest increment
#   the macro reports. There is nothing left to turn.
#
# Constraint R5: the coil only reaches screws up to X=195. The
# right-hand ones would need the nozzle at 257, above the 250
# limit — they sit at 249 instead, leaving the coil ~8mm short of
# the screw. At the measured gradient that is ~0.007mm of error,
# the same order as the probe's own noise. Not worth chasing.
#
# DO NOT compare these z values against bed_mesh numbers. This
# macro probes statically at horizontal_move_z: 3; the mesh scans
# continuously at 2.0. Different heights on a non-linear sensor
# curve, different methods entirely. The screws reported 0.017mm
# across X while the mesh reported 0.146mm across the same span:
# that is expected, not a contradiction. The screws tram the
# FRAME; the mesh maps the SURFACE. Judge each by its own
# internal spread only.
# ============================================================
[screws_tilt_adjust]
screw1: 87, 44
screw1_name: front left screw
screw2: 249, 44
screw2_name: front right screw
screw3: 249, 214
screw3_name: rear right screw
screw4: 87, 214
screw4_name: rear left screw
horizontal_move_z: 3
speed: 50
screw_thread: CW-M4

# ============================================================
# [GEO] AXIS TWIST COMPENSATION — disabled, and rightly so
#
# Diagnosis performed with TAP_SWEEP, before tramming:
#   tap at X=60  -> -0.151
#   tap at X=140 -> -0.045
#   gradient = 0.106 / 80mm  = 0.0013 mm/mm
#   mesh     = 0.281 / 168mm = 0.0017 mm/mm
#
# Tap measures with the NOZZLE, the mesh with the COIL. They
# agreed. If the X axis were twisted they would diverge, because
# the coil would be reading a point at a different height than
# the nozzle. So the tilt belonged to the BED — and tramming the
# screws duly halved the mesh range, confirming it.
#
# Only re-enable this if, with the bed mechanically level, tap
# and mesh start disagreeing.
# ============================================================
# [axis_twist_compensation]
# speed: 50
# horizontal_move_z: 3
# calibrate_start_x: 90
# calibrate_end_x: 240
# calibrate_y: 133

# ============================================================
# FIRMWARE RETRACTION — currently UNUSED
#
# OrcaSlicer does slicer-side retraction (G1 E- moves). The sliced
# G-code contains no G10/G11, so nothing below takes effect.
# Retraction is per-filament and lives in the Orca filament
# profile (Setting Overrides -> Retraction length).
#
# Keep "Use firmware retraction" OFF in Orca's printer settings.
# If it is ever switched on, Orca emits G10/G11 and these 0.8mm
# silently override every filament's own value.
#
# Retraction test on ASA (0-2mm, step 0.1) got slightly WORSE
# going up the tower, even though retraction was increasing. So
# in that range retraction length is not what controls stringing;
# heat building in the enclosure is. 0.4mm was chosen (the top of
# Orca's 0.2-0.4 suggestion for low-ooze filaments like ABS). If
# stringing appears, the levers are temperature, travel speed and
# wipe/z-hop — NOT more retraction.
# ============================================================
[firmware_retraction]
retract_length: 0.8
retract_speed: 45
unretract_extra_length: 0
unretract_speed: 35

# ============================================================
# MACROS — PRINT LIFECYCLE
# ============================================================
# The order is deliberate:
#   heat -> home -> soak -> tap -> mesh -> purge
# Tap defines the true zero using the nozzle; the mesh maps the
# topography anchored to that zero. Swapping the order breaks both.
#
# KAMP was removed entirely. LINE_PURGE and SMART_PARK both need
# the slicer to emit EXCLUDE_OBJECT_DEFINE, and when it is
# missing they silently fall back to (0,0) and crash against
# position_min: 30. That happened three times. With an eddy probe
# and rapid_scan a full 7x7 mesh takes seconds, so adaptive
# meshing bought nothing in exchange for that fragility.
# [exclude_object] is kept for object cancellation in Mainsail.
# ============================================================
[gcode_macro START_PRINT]
description: "Start: heat -> home -> tap -> mesh -> purge -> print"
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    {% set Z_ADJUST = params.Z_ADJUST|default(0.0)|float %}

    M117 Heating...
    M140 S{BED_TEMP}
    M104 S150
    M190 S{BED_TEMP}

    # Clear any babystep left from a previous print — otherwise it
    # stacks on top of the tap's zero with no visible cause.
    SET_GCODE_OFFSET Z=0 MOVE=0

    M117 Homing...
    G28

    # G28 leaves the coil at the plate centre, which is exactly
    # where it needs to be to stabilise thermally. Without this,
    # at 110C the tap fails with stddev > 0.020 and the samples
    # drift downward through the sequence.
    # For ASA this soak doubles as chamber warm-up.
    M117 Settling sensor...
    {% if BED_TEMP > 70 %}
        G4 P120000
    {% else %}
        G4 P30000
    {% endif %}

    # TAP after G28, never before: G28 uses the sensor and stops
    # at 2mm; tap corrects that zero by measuring the nozzle's
    # real contact. Running G28 after a tap would discard it.
    # Tap at (180,133) -> moves to (235,141). Within travel.
    M117 Tapping...
    PROBE_EDDY_NG_TAP

    M117 Meshing bed...
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE METHOD=rapid_scan

    {% if Z_ADJUST != 0.0 %}
        SET_GCODE_OFFSET Z_ADJUST={Z_ADJUST} MOVE=0
    {% endif %}

    # Move to the purge position BEFORE the final heat-up — any
    # ooze lands where it is going to be purged anyway.
    M117 Heating nozzle...
    G1 X35 Y5 Z5 F5000
    M109 S{EXTRUDER_TEMP}

    # Fixed purge: two lines along the front of the bed. M83 makes
    # each E value the amount to extrude for that move, regardless
    # of whichever mode was left set before.
    # Note: Y=5 is outside the meshed area (which starts at 25), so
    # the purge sits on extrapolated values. Irrelevant for a
    # purge line.
    M117 Purging...
    G1 Z0.3 F600
    M83
    G1 X165 Y5 E12 F1200
    G1 X165 Y5.6 F5000
    G1 X35 Y5.6 E12 F1200
    G92 E0
    G1 Z2 F3000

    M117 Printing...

[gcode_macro END_PRINT]
description: "End of print: lift Z, present the bed, turn everything off"
gcode:
    M117 Finishing...
    G91
    G1 Z10 F3000
    G90
    # X35 and not X5: travel starts at 30 (see [stepper_x]).
    G1 X35 Y{printer.toolhead.axis_maximum.y - 10} F5000
    M104 S0
    M140 S0
    M106 S0
    M84 X Y E
    SET_GCODE_OFFSET Z=0 MOVE=0
    SET_IDLE_TIMEOUT TIMEOUT=3600
    M117 Done!

[gcode_macro CANCEL_PRINT]
description: "Cancel print and move to an accessible position"
rename_existing: CANCEL_PRINT_BASE
gcode:
    CANCEL_PRINT_BASE
    G91
    G1 Z10 F3000
    G90
    G1 X35 Y{printer.toolhead.axis_maximum.y - 10} F5000
    M104 S0
    M140 S0
    M106 S0
    M84 X Y E
    SET_GCODE_OFFSET Z=0 MOVE=0
    M117 Print cancelled

# ============================================================
# MACROS — PREHEAT
# ============================================================
[gcode_macro PREHEAT_PLA]
description: "Preheat for PLA: bed 60C, nozzle 200C"
gcode:
    SET_IDLE_TIMEOUT TIMEOUT=3600
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=60
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=200
    M117 PLA: heating...

[gcode_macro PREHEAT_PETG]
description: "Preheat for PETG: bed 80C, nozzle 235C"
gcode:
    SET_IDLE_TIMEOUT TIMEOUT=3600
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=80
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=235
    M117 PETG: heating...

[gcode_macro PREHEAT_ASA]
description: "Preheat for ASA/ABS: bed 110C, nozzle 240C"
gcode:
    SET_IDLE_TIMEOUT TIMEOUT=3600
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=110
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=240
    M117 ASA: heating...

[gcode_macro PREHEAT_OFF]
description: "Turn off heaters and reset the idle timeout"
gcode:
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
    SET_IDLE_TIMEOUT TIMEOUT=3600
    M117 Heaters off

# ============================================================
# MACROS — MAINTENANCE
# ============================================================
[gcode_macro PURGE]
description: "Purge 50mm of filament. Usage: PURGE [TEMP=240]"
gcode:
    {% set TEMP = params.TEMP|default(0)|float %}
    {% if TEMP > 0 %}
        M109 S{TEMP}
    {% endif %}
    {% if printer.extruder.temperature < printer.configfile.settings.extruder.min_extrude_temp %}
        { action_raise_error("Nozzle is cold! Use PURGE TEMP=200 to heat first.") }
    {% endif %}
    G91
    G1 E50 F300
    G90
    G92 E0
    M117 Purge complete

[gcode_macro AUTO_BED_LEVEL]
description: "Full 7x7 mesh at 60C with tap, saved as 'default'"
gcode:
    M140 S60
    M104 S150
    M190 S60
    G28
    G4 P30000
    PROBE_EDDY_NG_TAP
    BED_MESH_CALIBRATE METHOD=rapid_scan
    BED_MESH_PROFILE SAVE=default
    M117 Mesh saved!

[gcode_macro TILT_ADJUST]
description: "Compute bed screw adjustments (hot)"
gcode:
    # Hot on purpose: the plate expands, and it is when hot that
    # it matters. Let it soak ~10min before running this — M190
    # returns as soon as the thermistor reads target, long before
    # the whole plate has expanded.
    # Last run: all four screws within 00:01, spread 0.033mm.
    # Re-run only after moving the plate or the springs.
    M140 S60
    M104 S150
    M190 S60
    G28
    SCREWS_TILT_CALCULATE

[gcode_macro SCREW_CHECK]
description: "Walk the COIL over the 4 configured screw positions for visual checking"
gcode:
    # Kept as a diagnostic, no longer needed routinely — the
    # screw coordinates were validated by outcome (see the
    # [screws_tilt_adjust] section). Use this only if
    # SCREWS_TILT_CALCULATE ever reports the bed level while the
    # mesh disagrees: it parks the COIL over each configured
    # position with a 5-second pause so you can confirm by eye
    # that it really is sitting over a screw.
    G28
    M117 Front left...
    G1 X87 Y44 Z10 F5000
    G4 P5000
    M117 Front right...
    G1 X249 Y44 Z10 F5000
    G4 P5000
    M117 Rear right...
    G1 X249 Y214 Z10 F5000
    G4 P5000
    M117 Rear left...
    G1 X87 Y214 Z10 F5000
    G4 P5000
    G1 X180 Y133 F5000
    M117 SCREW_CHECK complete

# ============================================================
# MACROS — Z OFFSET
#
# Z_UP / Z_DOWN: TEMPORARY adjustment during a print (gcode
# offset). Cleared in START_PRINT and END_PRINT.
#
# To make it permanent: Z_SAVE_OFFSET at the end of the print,
# then SAVE_CONFIG. It transfers the babystep into tap_adjust_z.
#
# WARNING: Z_OFFSET_APPLY_PROBE does NOT apply to eddy-ng. It has
# no generic z_offset — the only persistent adjustments are the
# tap ones. And PROBE_EDDY_NG_SET_TAP_ADJUST_Z does not take
# effect mid-print, only at the next tap; that is why live
# adjustment uses SET_GCODE_OFFSET (Z_UP/Z_DOWN).
#
# The paper test was tried and abandoned: "slight friction" is
# subjective, paper is ~0.1mm thick, and after a tap the nozzle
# ends up somewhere other than where it touched. Dial the offset
# from a printed first layer instead.
# ============================================================
[gcode_macro Z_UP]
description: "Baby step Z +0.02mm (temporary)"
gcode:
    SET_GCODE_OFFSET Z_ADJUST=0.02 MOVE=1

[gcode_macro Z_DOWN]
description: "Baby step Z -0.02mm (temporary)"
gcode:
    SET_GCODE_OFFSET Z_ADJUST=-0.02 MOVE=1

[gcode_macro Z_SAVE_OFFSET]
description: "Transfer the current babystep into tap_adjust_z (eddy-ng)"
gcode:
    {% set z = printer.gcode_move.homing_origin.z|float %}
    {% if z == 0.0 %}
        RESPOND MSG="No active babystep — nothing to save."
    {% else %}
        PROBE_EDDY_NG_SET_TAP_ADJUST_Z ADJUST={z}
        SET_GCODE_OFFSET Z=0 MOVE=0
        RESPOND MSG="tap_adjust_z adjusted by {z}mm. Run SAVE_CONFIG to persist."
    {% endif %}

# ============================================================
# MACROS — DIAGNOSTICS
# ============================================================
[gcode_macro TAP_SWEEP]
description: "Three taps across X: tells a tilted bed apart from a twisted axis"
gcode:
    # Tap measures with the NOZZLE; the mesh measures with the COIL.
    #   they agree    -> the BED is tilted, adjust the screws
    #   they diverge  -> X axis TWIST, use axis_twist_compensation
    #
    # [GEO] Constraint R3: X_tap <= 195, because the tap shifts the
    # nozzle +55 after touching. X=220 produced
    # "Move out of range: 275.000" — this already happened.
    #
    # G28 before every tap (R4), otherwise each one measures a
    # different point and the comparison is worthless.
    G28
    M117 Tap at X=60...
    G1 X60 Y125 F3000
    PROBE_EDDY_NG_TAP
    G28
    M117 Tap at X=125...
    G1 X125 Y125 F3000
    PROBE_EDDY_NG_TAP
    G28
    M117 Tap at X=190...
    G1 X190 Y125 F3000
    PROBE_EDDY_NG_TAP
    M117 TAP_SWEEP complete

# SUPERSEDED — kept for reference only, do not run this.
# This is Klipper's manual method: it sweeps ACCELERATION and
# makes you count ripples and compute freq = V * N / D.
# OrcaSlicer's Calibration > Input Shaping does it better, by
# sweeping the SHAPER FREQUENCY itself so you read the answer off
# the part instead of doing arithmetic. Running this macro
# alongside Orca's test would fight it — both try to drive a
# TUNING_TOWER.
# See the [input_shaper] section: both towers came out uniform
# and the shaper is intentionally left disabled.
[gcode_macro RINGING_TOWER]
description: "SUPERSEDED by OrcaSlicer's Input Shaping calibration — do not run"
gcode:
    SET_PRESSURE_ADVANCE ADVANCE=0
    SET_INPUT_SHAPER SHAPER_FREQ_X=0 SHAPER_FREQ_Y=0
    TUNING_TOWER COMMAND=SET_VELOCITY_LIMIT PARAMETER=ACCEL START=1500 STEP_DELTA=500 STEP_HEIGHT=5

# Prefer OrcaSlicer's Pressure Advance test. This is the manual
# fallback. PA is per-filament, not a machine constant.
[gcode_macro CALIBRATE_PRESSURE_ADVANCE]
description: "Tuning tower for pressure advance (prefer OrcaSlicer's test)"
gcode:
    SET_PRESSURE_ADVANCE ADVANCE=0
    SET_VELOCITY_LIMIT ACCEL=3000
    TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE PARAMETER=ADVANCE START=0 FACTOR=.020

# ============================================================
# MACROS — FILAMENT CHANGE
# ============================================================
[gcode_macro M600]
description: "Filament change"
gcode:
    # Defaults kept within travel (X minimum is 30).
    {% set X = params.X|default(60)|float %}
    {% set Y = params.Y|default(10)|float %}
    {% set Z = params.Z|default(10)|float %}
    SAVE_GCODE_STATE NAME=M600_state
    PAUSE
    G91
    G1 E-1 F2700
    G1 Z{Z}
    G90
    G1 X{X} Y{Y} F3000
    G91
    G1 E-50 F1000
    RESTORE_GCODE_STATE NAME=M600_state

