# ============================================================
# Ender 3 Pro - Klipper Config
# Hardware: SKR Mini E3 v3.0 | BTT Pi 1.2.1
#           Sprite SE Extruder | Dual Z | Hero Me Gen7
#           Phaetus Dragonfly BMS | BTT Eddy Duo | PEI Steel 250x250
# Firmware: Klipper v0.13+ (host com eddy-ng instalado)
# ============================================================
# NOTE: STM32G0B0 com "8KiB bootloader" e UART communication.
# Flash: klipper.bin -> firmware.bin na SD card.
#
# EDDY DUO / EDDY-NG — notas críticas:
#  * O firmware do Eddy TEM de ser compilado a partir da mesma
#    árvore onde o eddy-ng foi instalado (~/klipper). Compilar
#    de outra árvore dá "Unknown command: ldc1612_ng_start_stop".
#    Flash: make flash FLASH_DEVICE=2e8a:0003 (com botão BOOT
#    premido ao ligar o USB).
#  * O TAP desloca o toolhead +52mm X / +11mm Y a cada execução
#    (toca com o bico, depois reposiciona o coil sobre esse ponto).
#    Fazer G28 SEMPRE antes de cada tap, senão "anda" pela mesa
#    e destrói a repetibilidade.
# ============================================================

# ============================================================
# INCLUDES
# ============================================================
[include mainsail.cfg]
[include KAMP_Settings.cfg]
[include klipper-backup.cfg]
#[include KAMP/Adaptive_Meshing.cfg]  # Replaced by native Klipper adaptive meshing
[include KAMP/Line_Purge.cfg]
[include KAMP/Smart_Park.cfg]

# ============================================================
# VIRTUAL SDCARD
# ============================================================
[virtual_sdcard]
path: /home/biqu/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

# ============================================================
# CORE FEATURES
# ============================================================
[exclude_object]
[display_status]
[pause_resume]
[respond]

[gcode_arcs]
resolution: 0.1

[idle_timeout]
timeout: 3600

[force_move]
enable_force_move: True

# ============================================================
# STEPPERS
# ============================================================
[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: 30
position_min: 30
position_max: 250
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.580
stealthchop_threshold: 999999

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_max: 250
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.580
stealthchop_threshold: 999999

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 250
position_min: -3.0

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.580
stealthchop_threshold: 999999

# ============================================================
# EXTRUDER - Sprite SE + Dragonfly BMS
# rotation_distance verificado 2026-08-30: 100mm pedidos = 100mm
# extrudidos. Não alterar sem repetir o teste.
# ============================================================
[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 16
rotation_distance: 7.57
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
min_temp: 0
max_temp: 300
min_extrude_temp: 170
max_extrude_only_distance: 200
max_extrude_cross_section: 5
# PENDENTE: descomentar após calibração de pressure advance
# (usar o teste integrado do OrcaSlicer, mais fiável que a torre manual)
# pressure_advance: 0.04
# pressure_advance_smooth_time: 0.040

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.75
stealthchop_threshold: 0

# ============================================================
# HEATED BED
# ============================================================
[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 130

# ============================================================
# FANS
# ============================================================
[heater_fan heatbreak_cooling_fan]
pin: PC7

[heater_fan controller_fan]
pin: PB15

[fan]
pin: PC6

# ============================================================
# MCU & PRINTER
# ============================================================
[mcu]
serial: /dev/ttyS0          # BTT Pi 1.2 com CB1 OS usa ttyS0
baud: 250000
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
square_corner_velocity: 5.0

[board_pins]
aliases:
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>

# ============================================================
# INPUT SHAPER
# NÃO há acelerómetro nesta máquina (o Eddy Duo não traz um).
# A afinar por ringing tower manual — ver macro RINGING_TOWER.
# Até lá, max_accel: 3000 pode produzir ghosting; baixar para
# 2000 se se notar em peças com cantos.
# ============================================================
[input_shaper]
# shaper_type_x: mzv
# shaper_freq_x: 0
# shaper_type_y: mzv
# shaper_freq_y: 0

# ============================================================
# FILAMENT RUNOUT SENSOR
# Hardware: sensor NO ligado ao PC15 do SKR Mini E3 v3.0
# Descomentar quando instalado.
# ============================================================
# [filament_switch_sensor filament_sensor]
# switch_pin: ^PC15
# pause_on_runout: True
# runout_gcode:
#     M117 Filamento acabou!
#     M600
# insert_gcode:
#     M117 Filamento detetado

# ============================================================
# CR TOUCH — REMOVIDO, substituído pelo Eddy Duo.
# Mantido comentado apenas como referência histórica.
# NOTA: se alguma vez o reativares, lembra-te que o bloco
# SAVE_CONFIG no fim do ficheiro também precisa da entrada
# [bltouch] correspondente — sem ela o Klipper recusa arrancar.
# ============================================================
#[bltouch]
#sensor_pin: ^PC14
#control_pin: PA1
#x_offset: -46
#y_offset: -3
#speed: 5.0
#samples: 2
#samples_result: median
#sample_retract_dist: 3.5
#samples_tolerance: 0.025
#samples_tolerance_retries: 3

# ============================================================
# BTT EDDY DUO (eddy-ng)
# Offset medido: 52mm à esquerda, 11mm à frente do bico.
#
# tap_adjust_z: quanto o bico fica ACIMA do ponto de contacto
# detetado pelo tap. Compensa a flexão da estrutura, que faz o
# tap disparar já ligeiramente pressionado (overshoot ~0.05).
# Afinar imprimindo, nunca com o teste do papel:
#   PROBE_EDDY_NG_SET_TAP_ADJUST_Z ADJUST=-0.02   (baixar)
#   PROBE_EDDY_NG_SET_TAP_ADJUST_Z ADJUST=0.02    (subir)
# e depois gravar aqui o valor final.
# ============================================================
[mcu eddy]
serial: /dev/serial/by-id/usb-Klipper_rp2040_5044340410BB8B1C-if00
restart_method: command

[probe_eddy_ng btt_eddy]
sensor_type: btt_eddy
i2c_mcu: eddy
i2c_bus: i2c0f
x_offset: -55
y_offset: -8
home_trigger_height: 2.0
#tap_adjust_z: 0.16
write_tap_plot: true

[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10
max_temp: 100

[temperature_sensor btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26

# ============================================================
# SAFE Z HOME
# Posição do BICO tal que o PROBE fica no centro (115, 115):
#   home_x = 115 - (-52) = 167
#   home_y = 115 - (-11) = 126
#
# z_hop: 3 (não 10). Acima de ~5mm o coil sai do alcance útil
# e o homing começa às cegas. 3mm chega para não arrastar.
# ============================================================
[safe_z_home]
home_xy_position: 170, 123
speed: 50
z_hop: 3

# ============================================================
# BED MESH
# mesh_min/mesh_max são coordenadas do PROBE.
# Com x_offset=-52, y_offset=-11 o bico percorre:
#   nozzle_min = (10+52, 23+11) = (62, 34)
#   nozzle_max = (194+52, 223+11) = (246, 234) — dentro de 250
# mesh_max X limitado a 194 por causa disso (era 200 com o CR Touch).
#
# horizontal_move_z: 2.0 — altura ótima de leitura do eddy.
# Ao contrário de um probe de contacto, não há vantagem em subir
# entre pontos.
# 7x7 porque o scan sem contacto é rápido; densidade sai barata.
# ============================================================
[bed_mesh]
speed: 150
probe_count: 7, 7
fade_start: 1.0
fade_end: 10.0
fade_target: 0.0
mesh_pps: 2, 2
horizontal_move_z: 2.0
mesh_min: 25, 25
mesh_max: 193, 225
algorithm: bicubic
adaptive_margin: 10

# ============================================================
# SCREWS TILT ADJUST
# Coordenadas do BICO, calculadas para o PROBE ficar sobre cada
# parafuso. Offset Eddy: x=-52, y=-11.
# Parafusos direitos: bico limitado a X=249 (max 250), pelo que o
# probe fica ~5mm aquém do parafuso — irrelevante para o tilt.
# ============================================================
[screws_tilt_adjust]
screw1: 87, 44
screw1_name: front left screw
screw2: 249, 44
screw2_name: front right screw
screw3: 249, 214
screw3_name: rear right screw
screw4: 87, 214
screw4_name: rear left screw
horizontal_move_z: 3
speed: 50
screw_thread: CW-M4

# ============================================================
# AXIS TWIST COMPENSATION
# Desativado — variação medida <0.02mm, irrelevante.
# Reativar se houver mudança mecânica no eixo X.
# NOTA: coordenadas abaixo são do CR Touch, recalcular para o
# Eddy (x+52, y+11) antes de reativar.
# ============================================================
# [axis_twist_compensation]
# speed: 50
# horizontal_move_z: 3
# calibrate_start_x: 62
# calibrate_end_x: 246
# calibrate_y: 126

# ============================================================
# FIRMWARE RETRACTION
# ============================================================
[firmware_retraction]
retract_length: 0.8
retract_speed: 45
unretract_extra_length: 0
unretract_speed: 35

# ============================================================
# MACROS — PRINT LIFECYCLE
# ============================================================
[gcode_macro START_PRINT]
description: "Start: aquece -> home -> tap -> mesh adaptativa -> park -> purga"
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    {% set Z_ADJUST = params.Z_ADJUST|default(0.0)|float %}

    M117 A aquecer...
    M140 S{BED_TEMP}
    M104 S150
    M190 S{BED_TEMP}

    # Limpa qualquer babystep de uma impressão anterior — senão
    # acumula-se em cima do zero do tap sem se perceber porquê.
    SET_GCODE_OFFSET Z=0 MOVE=0

    M117 Home...
    G28

    M117 A estabilizar sensor...
    {% if BED_TEMP > 70 %}
        G4 P120000
    {% else %}
        G4 P30000
    {% endif %}

    # TAP: mede o contacto real do bico. Tem de vir DEPOIS do G28
    # (o G28 usa o sensor e para aos 2mm; o tap corrige esse zero).
    # Nunca fazer G28 depois do tap — descartaria a correção.
    M117 Tap...
    PROBE_EDDY_NG_TAP

    M117 A nivelar bed...
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE ADAPTIVE=1 METHOD=rapid_scan

    {% if Z_ADJUST != 0.0 %}
        SET_GCODE_OFFSET Z_ADJUST={Z_ADJUST} MOVE=0
    {% endif %}

    SMART_PARK
    M117 A aquecer extrusor...
    M109 S{EXTRUDER_TEMP}
    M117 A purgar...
    LINE_PURGE
    M117 A imprimir...

[gcode_macro END_PRINT]
description: "Fim de impressão: eleva Z, move cama para frente, desliga tudo"
gcode:
    M117 A terminar...
    G91
    G1 Z10 F3000
    G90
    G1 X35 Y{printer.toolhead.axis_maximum.y - 10} F5000
    M104 S0
    M140 S0
    M106 S0
    M84 X Y E
    SET_GCODE_OFFSET Z=0 MOVE=0
    SET_IDLE_TIMEOUT TIMEOUT=3600
    M117 Concluído!

[gcode_macro CANCEL_PRINT]
description: "Cancela print e move para posição de acesso"
rename_existing: CANCEL_PRINT_BASE
gcode:
    CANCEL_PRINT_BASE
    G91
    G1 Z10 F3000
    G90
    G1 X5 Y{printer.toolhead.axis_maximum.y - 10} F5000
    M104 S0
    M140 S0
    M106 S0
    M84 X Y E
    SET_GCODE_OFFSET Z=0 MOVE=0
    M117 Print cancelado

# ============================================================
# MACROS — PRÉ-AQUECIMENTO
# ============================================================
[gcode_macro PREHEAT_PLA]
description: "Pré-aquece para PLA: bed 60C, extrusor 200C"
gcode:
    SET_IDLE_TIMEOUT TIMEOUT=3600
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=60
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=200
    M117 PLA: a aquecer...

[gcode_macro PREHEAT_PETG]
description: "Pré-aquece para PETG: bed 80C, extrusor 235C"
gcode:
    SET_IDLE_TIMEOUT TIMEOUT=3600
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=80
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=235
    M117 PETG: a aquecer...

[gcode_macro PREHEAT_ABS]
description: "Pré-aquece para ABS: bed 110C, extrusor 250C"
gcode:
    SET_IDLE_TIMEOUT TIMEOUT=3600
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=110
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=250
    M117 ABS: a aquecer...

[gcode_macro PREHEAT_OFF]
description: "Desliga aquecimento e reset timeout"
gcode:
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
    SET_IDLE_TIMEOUT TIMEOUT=3600
    M117 Aquecimento desligado

# ============================================================
# MACROS — MANUTENÇÃO
# ============================================================
[gcode_macro PURGE]
description: "Purga 50mm de filamento. Uso: PURGE [TEMP=240]"
gcode:
    {% set TEMP = params.TEMP|default(0)|float %}
    {% if TEMP > 0 %}
        M109 S{TEMP}
    {% endif %}
    {% if printer.extruder.temperature < printer.configfile.settings.extruder.min_extrude_temp %}
        { action_raise_error("Extrusor frio! Usa PURGE TEMP=200 para aquecer primeiro.") }
    {% endif %}
    G91
    G1 E50 F300
    G90
    G92 E0
    M117 Purga concluída

[gcode_macro AUTO_BED_LEVEL]
description: "Mesh completa 7x7 a 60C com tap, guarda como 'default'"
gcode:
    M140 S60
    M104 S150
    M190 S60
    G28
    PROBE_EDDY_NG_TAP
    BED_MESH_CALIBRATE METHOD=rapid_scan
    BED_MESH_PROFILE SAVE=default
    M117 Mesh guardada!

[gcode_macro TILT_ADJUST]
description: "Calcula ajuste dos parafusos do bed (a quente)"
gcode:
    # A quente de propósito: a mesa dilata e é nivelada a quente
    # que ela interessa. Deixar encharcar ~10min antes de correr.
    M140 S60
    M104 S150
    M190 S60
    G28
    SCREWS_TILT_CALCULATE

# ============================================================
# MACROS — Z OFFSET
#
# Z_UP / Z_DOWN: ajuste TEMPORÁRIO durante uma impressão
# (gcode offset). É limpo no START_PRINT e no END_PRINT.
#
# Para tornar permanente, usar Z_SAVE_OFFSET no fim da
# impressão — transfere o babystep para o tap_adjust_z, que é
# o mecanismo próprio do eddy-ng.
#
# ATENÇÃO: o antigo Z_OFFSET_APPLY_PROBE NÃO se aplica ao
# eddy-ng. O eddy-ng não tem z_offset genérico — os únicos
# ajustes persistentes são os do tap.
# ============================================================
[gcode_macro Z_UP]
description: "Baby step Z +0.02mm (temporário)"
gcode:
    SET_GCODE_OFFSET Z_ADJUST=0.02 MOVE=1

[gcode_macro Z_DOWN]
description: "Baby step Z -0.02mm (temporário)"
gcode:
    SET_GCODE_OFFSET Z_ADJUST=-0.02 MOVE=1

[gcode_macro Z_SAVE_OFFSET]
description: "Transfere o babystep atual para tap_adjust_z (eddy-ng)"
gcode:
    {% set z = printer.gcode_move.homing_origin.z|float %}
    {% if z == 0.0 %}
        RESPOND MSG="Nenhum babystep ativo — nada a gravar."
    {% else %}
        PROBE_EDDY_NG_SET_TAP_ADJUST_Z ADJUST={z}
        SET_GCODE_OFFSET Z=0 MOVE=0
        RESPOND MSG="tap_adjust_z ajustado em {z}mm. Corre PROBE_EDDY_NG_STATUS, lê o valor final e escreve-o no printer.cfg (tap_adjust_z)."
    {% endif %}

# ============================================================
# MACROS — CALIBRAÇÃO
# ============================================================
[gcode_macro RINGING_TOWER]
description: "Ringing tower manual (sem acelerómetro) para input shaper"
gcode:
    # Imprimir o modelo de teste de ringing do Klipper
    # (docs/prints/ringing_tower.stl) com esta macro ativa.
    # Depois medir a distância entre ondulações e calcular:
    #   freq = velocidade_do_movimento / distancia_entre_ondas
    SET_PRESSURE_ADVANCE ADVANCE=0
    SET_INPUT_SHAPER SHAPER_FREQ_X=0 SHAPER_FREQ_Y=0
    TUNING_TOWER COMMAND=SET_VELOCITY_LIMIT PARAMETER=ACCEL START=1500 STEP_DELTA=500 STEP_HEIGHT=5

[gcode_macro CALIBRATE_PRESSURE_ADVANCE]
description: "Tuning tower para pressure advance (preferir o teste do OrcaSlicer)"
gcode:
    SET_PRESSURE_ADVANCE ADVANCE=0
    SET_VELOCITY_LIMIT ACCEL=3000
    TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE PARAMETER=ADVANCE START=0 FACTOR=.020

# ============================================================
# MACROS — FILAMENT CHANGE
# ============================================================
[gcode_macro M600]
description: "Troca de filamento"
gcode:
    {% set X = params.X|default(50)|float %}
    {% set Y = params.Y|default(0)|float %}
    {% set Z = params.Z|default(10)|float %}
    SAVE_GCODE_STATE NAME=M600_state
    PAUSE
    G91
    G1 E-1 F2700
    G1 Z{Z}
    G90
    G1 X{X} Y{Y} F3000
    G91
    G1 E-50 F1000
    RESTORE_GCODE_STATE NAME=M600_state

