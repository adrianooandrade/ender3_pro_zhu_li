# Runs klipper-backup script.sh from a Mainsail macro
# Provides: BACKUP_NOW (manual full backup of printer_data/config to GitHub)

[gcode_shell_command backup_configs]
command: bash -c "bash $HOME/klipper-backup/script.sh -c \"Manual backup from Mainsail - $(date +\"%%x - %%X\")\""
timeout: 120.
verbose: True

[gcode_macro BACKUP_NOW]
description: Backup printer config to GitHub via klipper-backup
gcode:
    RESPOND MSG="Starting backup to GitHub..."
    RUN_SHELL_COMMAND CMD=backup_configs
    RESPOND MSG="Backup finished. Check github.com/adrianooandrade/ender3_pro_zhu_li"
